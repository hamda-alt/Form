/* ============================ Data ============================ */

const STATUSES = ['todo','in_progress','complete'];
const STATUS_LABEL = { todo:'TO DO', in_progress:'IN PROGRESS', complete:'COMPLETE' };
const STATUS_DOT = { todo:'#8b95a5', in_progress:'#5B7FFF', complete:'#10B981' };
const iconFor = t => (FIELD_TYPES.find(f => f.type === t) || {}).icon || 'type';
const labelFor = t => (FIELD_TYPES.find(f => f.type === t) || {}).label || t;

function makeField(type) {
  const meta = FIELD_TYPES.find(f => f.type === type) || FIELD_TYPES[0];
  const opts = type === 'dropdown' || type === 'multi_select';
  return { id: uid(), field_key:'', field_type:type, label:meta.label, placeholder:'', help_text:'', required:false,
    options: opts ? [{label:'Option 1',value:'option_1'},{label:'Option 2',value:'option_2'},{label:'Option 3',value:'option_3'}] : [],
    config: type === 'rating' ? { scale:5 } : type === 'file_upload' ? { accept:'', maxSizeMb:10 } : {}, task_property:null };
}
function makeTP(property) {
  const meta = TASK_PROPERTIES.find(t => t.property === property) || TASK_PROPERTIES[0];
  const f = makeField(meta.fieldType);
  f.label = meta.label === 'Custom Field' ? 'Custom field' : meta.label;
  f.task_property = property === 'custom' ? 'custom:Custom field' : property;
  if (meta.options) f.options = meta.options.map(o => ({ ...o }));
  if (property === 'task_name' || property === 'description') f.required = true;
  return f;
}
const f = (type, label, extra = {}) => Object.assign(makeField(type), { label }, extra);
const tp = (prop, label, extra = {}) => Object.assign(makeTP(prop), label ? { label } : {}, extra);

/* Workspace hierarchy: Spaces -> Lists (where submissions land) */
const SPACES = [
  { id:'sp1', name:'Team Space',  color:'#7B68EE', lists:[{id:'l1',name:'Incoming'},{id:'l2',name:'Requests'},{id:'l3',name:'Bugs'}] },

  { id:'sp3', name:'Operations',  color:'#10B981', lists:[{id:'l6',name:'IT Requests'},{id:'l7',name:'HR Onboarding'}] },
];

function buildTask(form, fields, answers) {
  let name = '', description = form.task_template.description || '';
  let status = form.default_status || 'todo';
  let priority = form.default_priority || '', assignee = form.auto_assign_name || '', due = '';
  let tags = [...(form.task_template.tags || [])], custom = {};
  fields.forEach(fl => {
    if (!fl.task_property) return;
    const v = answers[keyOf(fl)]; const val = Array.isArray(v) ? v : (v == null ? '' : String(v)); const t = fl.task_property;
    if (t === 'task_name') { if (val) name = val; }
    else if (t === 'description') { if (val) description = (description ? description + '\n\n' : '') + val; }
    else if (t === 'assignee') { if (val) assignee = val; }
    else if (t === 'priority') { if (val) priority = val; }
    else if (t === 'status') { if (val) status = val; }
    else if (t === 'due_date') { if (val) due = val; }
    else if (t === 'tags') { if (Array.isArray(v)) tags = tags.concat(v); else if (val) tags.push(val); }
    else if (t.startsWith('custom:')) custom[t.slice(7)] = Array.isArray(v) ? v.join(', ') : val;
  });
  if (!name) name = form.name + ' — new submission';
  return { id: uid(), name, description, status, priority, assignee, due, tags, custom, created: Date.now() };
}

const cx = (...a) => a.filter(Boolean).join(' ');
function Btn({ variant = 'primary', size = 'md', children, className, ...p }) {

  const S = { sm:'h-8 px-3 text-xs gap-1.5', md:'h-9 px-4 text-sm gap-2' }[size];
  return <button className={cx('inline-flex items-center justify-center rounded-lg font-semibold transition-colors disabled:opacity-40 disabled:pointer-events-none', V, S, className)} {...p}>{children}</button>;
}

}
const inputCls = 'w-full rounded-lg border border-[#2c2c37] bg-[#0f0f14] px-3 py-2 text-sm text-zinc-100 placeholder:text-zinc-600 focus:outline-none focus:border-[#7B68EE] transition';
const Input = p => <input {...p} className={cx(inputCls, p.className)} />;
const Textarea = p => <textarea {...p} className={cx(inputCls, 'min-h-[76px] resize-y', p.className)} />;
const Select = ({ children, className, ...p }) => <select {...p} className={cx(inputCls, 'cursor-pointer', className)}>{children}</select>;
const Label = ({ children, className }) => <label className={cx('mb-1.5 block text-xs font-semibold uppercase tracking-wide text-zinc-500', className)}>{children}</label>;
function Switch({ checked, onChange }) {
  return <button role="switch" aria-checked={checked} onClick={() => onChange(!checked)} className={cx('relative h-5 w-9 shrink-0 rounded-full transition-colors', checked ? 'bg-[#7B68EE]' : 'bg-[#33333f]')}><span className={cx('absolute top-0.5 h-4 w-4 rounded-full bg-white transition-all', checked ? 'left-[18px]' : 'left-0.5')} /></button>;
}
function Badge({ children, className, color }) {

}

/* ============================ Signature ============================ */
function SignaturePad({ value, onChange }) {
  const ref = useRef(null), drawing = useRef(false), last = useRef({ x:0, y:0 });
  const [ink, setInk] = useState(!!value);
  useEffect(() => { const c = ref.current, dpr = window.devicePixelRatio || 1, r = c.getBoundingClientRect(); c.width = r.width * dpr; c.height = 140 * dpr; const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#111827'; }, []);
  const pos = e => { const r = ref.current.getBoundingClientRect(), t = e.touches?.[0]; return { x:(t?t.clientX:e.clientX)-r.left, y:(t?t.clientY:e.clientY)-r.top }; };
  const down = e => { drawing.current = true; last.current = pos(e); };
  const move = e => { if (!drawing.current) return; e.preventDefault(); const ctx = ref.current.getContext('2d'), p = pos(e); ctx.beginPath(); ctx.moveTo(last.current.x, last.current.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last.current = p; if (!ink) setInk(true); };
  const up = () => { if (drawing.current) { drawing.current = false; onChange(ref.current.toDataURL()); } };
  const clear = () => { const c = ref.current; c.getContext('2d').clearRect(0, 0, c.width, c.height); setInk(false); onChange(''); };
  return <div className="relative rounded-lg border border-black/15 bg-white" style={{ height:140 }}>
    <canvas ref={ref} style={{ width:'100%', height:140, touchAction:'none', cursor:'crosshair' }} onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up} onTouchStart={down} onTouchMove={move} onTouchEnd={up} />
    {!ink && <span className="pointer-events-none absolute inset-0 flex items-center justify-center text-sm text-black/30">Sign here</span>}
    {ink && <button type="button" onClick={clear} className="absolute right-2 top-2 rounded bg-black/5 px-2 py-1 text-xs text-black/60 hover:bg-black/10">Clear</button>}
  </div>;
}

/* ============================ Field Picker ============================ */
function PickCard({ icon, label, hint, accent, onClick }) {
  return <button onClick={onClick} className="flex w-full items-center gap-3 rounded-lg border border-[#26262f] bg-[#14141a] px-3 py-2.5 text-left transition hover:border-[#7B68EE]/60 hover:bg-[#1b1b23]">
    <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg" style={{ background: accent + '20', color: accent }}><Ic n={icon} s={18} /></span>
    <span className="min-w-0"><span className="block text-sm font-semibold text-zinc-100">{label}</span><span className="block truncate text-xs text-zinc-500">{hint}</span></span>
  </button>;
}
function FieldPicker({ open, onClose, onAdd }) {
  return <div className={cx('fixed inset-0 z-50', open ? '' : 'pointer-events-none')}>
    <div className={cx('absolute inset-0 bg-black/60 transition-opacity', open ? 'opacity-100' : 'opacity-0')} onClick={onClose} />
    <div className={cx('absolute right-0 top-0 flex h-full w-[380px] max-w-[88vw] flex-col border-l border-[#26262f] bg-[#0d0d12] shadow-2xl transition-transform duration-200', open ? 'translate-x-0' : 'translate-x-full')}>
      <div className="flex items-center justify-between border-b border-[#26262f] px-4 py-3.5"><h3 className="text-sm font-bold text-zinc-100">Add fields</h3><IconBtn onClick={onClose}><Ic n="x" s={16} /></IconBtn></div>
      <div className="flex-1 space-y-6 overflow-y-auto p-4">
        <section><h4 className="mb-2 text-[11px] font-bold uppercase tracking-wide text-zinc-500">Form fields</h4><div className="space-y-2">{FIELD_TYPES.map(ft => <PickCard key={ft.type} icon={ft.icon} label={ft.label} hint={ft.hint} accent="#7B68EE" onClick={() => onAdd(makeField(ft.type))} />)}</div></section>
        <section><h4 className="mb-1 text-[11px] font-bold uppercase tracking-wide text-zinc-500">Task properties</h4><p className="mb-2 text-xs text-zinc-500">Map an input straight onto the generated task.</p><div className="space-y-2">{TASK_PROPERTIES.map(t => <PickCard key={t.property} icon={t.icon} label={t.label} hint={t.property === 'custom' ? '→ custom field' : '→ task.' + t.property} accent="#10B981" onClick={() => onAdd(makeTP(t.property))} />)}</div></section>
      </div>
    </div>
  </div>;
}

/* ============================ Add-question dropdown (ClickUp style) ======== */
function AddQuestionMenu({ onAdd }) {
  const [open, setOpen] = useState(false);
  const [sub, setSub] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const h = e => { if (ref.current && !ref.current.contains(e.target)) { setOpen(false); setSub(false); } };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);
  const pick = fl => { onAdd(fl); setOpen(false); setSub(false); };
  const Item = ({ icon, label, onClick, arrow }) => (
    <button onClick={onClick} className="flex w-full items-center gap-2.5 rounded-md px-2.5 py-2 text-left text-sm text-zinc-200 hover:bg-[#1c1c22]">
      <span className="text-zinc-400"><Ic n={icon} s={16} /></span>{label}{arrow && <Ic n="fwd" s={13} cls="ml-auto text-zinc-500" />}
    </button>
  );
  return <div ref={ref} className="relative">
    <button onClick={() => setOpen(o => !o)} className="flex w-full items-center justify-center gap-2 rounded-xl border border-dashed border-[#2c2c37] py-3 text-sm font-semibold text-zinc-400 transition hover:border-[#7B68EE]/60 hover:text-zinc-200">
      <Ic n="plus" s={16} /> Add question
    </button>
    {open && <div className="absolute left-0 top-full z-40 mt-2 w-[262px] rounded-xl border border-[#26262f] bg-[#0d0d12] p-1.5 shadow-2xl">
      <div className="relative" onMouseEnter={() => setSub(true)} onMouseLeave={() => setSub(false)}>
        <Item icon="braces" label="Task property" arrow onClick={() => setSub(s => !s)} />
        {sub && <div className="absolute left-full top-0 z-50 ml-1 w-[210px] rounded-xl border border-[#26262f] bg-[#0d0d12] p-1.5 shadow-2xl">
          {TASK_PROPERTIES.map(t => <Item key={t.property} icon={t.icon} label={t.label} onClick={() => pick(makeTP(t.property))} />)}
        </div>}
      </div>
      <div className="my-1 h-px bg-[#1e1e26]" />
      {FIELD_TYPES.map(ft => <Item key={ft.type} icon={ft.icon} label={ft.label} onClick={() => pick(makeField(ft.type))} />)}
    </div>}
  </div>;
}

/* ============================ Canvas + Editor ============================ */
function Canvas({ fields, selectedId, onSelect, onReorder, onDup, onDel, onAdd }) {
  const drag = useRef(null);
  const drop = id => { const from = fields.findIndex(f => f.id === drag.current), to = fields.findIndex(f => f.id === id); if (from < 0 || to < 0 || from === to) return; const n = [...fields]; const [m] = n.splice(from, 1); n.splice(to, 0, m); onReorder(n); drag.current = null; };
  if (!fields.length) return <div className="flex flex-col items-center justify-center rounded-xl border border-dashed border-[#2c2c37] px-6 py-16 text-center"><Ic n="plus" s={30} cls="text-zinc-700" /><p className="mt-3 text-sm font-semibold text-zinc-300">Your form is empty</p><p className="mt-1 max-w-xs text-xs text-zinc-500">Add fields from the drawer, then map inputs to task properties to auto-fill generated tasks.</p><Btn size="sm" className="mt-4" onClick={onAdd}><Ic n="plus" s={15} /> Add a field</Btn></div>;
  return <div className="space-y-2.5">{fields.map(fl => {
    const sel = fl.id === selectedId, t = fl.task_property;
    return <div key={fl.id} draggable onDragStart={() => (drag.current = fl.id)} onDragOver={e => e.preventDefault()} onDrop={() => drop(fl.id)} onClick={() => onSelect(fl.id)} className={cx('group flex cursor-pointer items-start gap-3 rounded-xl border bg-[#14141a] p-3 transition', sel ? 'border-[#7B68EE] ring-1 ring-[#7B68EE]/40' : 'border-[#26262f] hover:border-[#3a3a46]')}>
      <span className="mt-0.5 cursor-grab text-zinc-600"><Ic n="grip" s={16} /></span>
      <span className="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-md bg-[#22222b] text-zinc-300"><Ic n={iconFor(fl.field_type)} s={15} /></span>
      <div className="min-w-0 flex-1"><div className="flex items-center gap-2"><span className="truncate text-sm font-semibold text-zinc-100">{fl.label || 'Untitled field'}</span>{fl.required && <span className="text-[#E5484D]">*</span>}</div>
        <div className="mt-1 flex flex-wrap items-center gap-1.5"><Badge>{labelFor(fl.field_type)}</Badge>{t && <Badge className="bg-[#10B981]/15 text-[#34d399]"><Ic n="link" s={11} /><span className="mono">{t.startsWith('custom:') ? t.slice(7) : 'task.' + t}</span></Badge>}</div></div>
      <div className="flex shrink-0 items-center opacity-0 transition group-hover:opacity-100"><IconBtn onClick={e => { e.stopPropagation(); onDup(fl.id); }}><Ic n="copy" s={14} /></IconBtn><IconBtn onClick={e => { e.stopPropagation(); onDel(fl.id); }}><Ic n="trash" s={14} /></IconBtn></div>
    </div>;
  })}</div>;
}
function FieldEditor({ field, onChange, onClose }) {
  if (!field) return <div className="flex h-full items-center justify-center p-6 text-center text-sm text-zinc-600">Select a field to edit its properties.</div>;
  const set = patch => onChange({ ...field, ...patch });
  const opts = field.field_type === 'dropdown' || field.field_type === 'multi_select';
  const isCustom = (field.task_property || '').startsWith('custom:');
  return <div className="flex h-full flex-col">
    <div className="flex items-center justify-between border-b border-[#26262f] px-4 py-3"><h3 className="text-sm font-bold text-zinc-100">Field settings</h3><IconBtn onClick={onClose}><Ic n="x" s={16} /></IconBtn></div>
    <div className="flex-1 space-y-4 overflow-y-auto p-4">
      <div><Label>Label</Label><Input value={field.label} onChange={e => set({ label: e.target.value })} /></div>
      {!['signature','checkbox','rating','info_block'].includes(field.field_type) && <div><Label>Placeholder</Label><Input value={field.placeholder || ''} onChange={e => set({ placeholder: e.target.value })} /></div>}
      <div><Label>{field.field_type === 'info_block' ? 'Body text' : 'Help text'}</Label><Input value={field.help_text || ''} onChange={e => set({ help_text: e.target.value })} placeholder="Optional hint" /></div>
      {opts && <div><Label>Options</Label><div className="space-y-2">{field.options.map((o, i) => <div key={i} className="flex items-center gap-2"><Input value={o.label} onChange={e => set({ options: field.options.map((x, j) => j === i ? { label: e.target.value, value: slug(e.target.value) } : x) })} /><IconBtn onClick={() => set({ options: field.options.filter((_, j) => j !== i) })}><Ic n="trash" s={14} /></IconBtn></div>)}<Btn variant="ghost" size="sm" onClick={() => set({ options: [...field.options, { label: 'Option ' + (field.options.length + 1), value: 'option_' + (field.options.length + 1) }] })}><Ic n="plus" s={14} /> Add option</Btn></div></div>}
      {field.field_type === 'rating' && <div><Label>Max stars</Label><Select value={field.config.scale || 5} onChange={e => set({ config: { ...field.config, scale: +e.target.value } })}>{[3,5,7,10].map(n => <option key={n} value={n}>{n}</option>)}</Select></div>}
      {field.field_type === 'file_upload' && <div><Label>Accepted types</Label><Input value={field.config.accept || ''} onChange={e => set({ config: { ...field.config, accept: e.target.value } })} placeholder=".pdf,.png" /></div>}
      <div className="flex items-center justify-between rounded-lg border border-[#26262f] bg-[#14141a] px-3 py-2.5"><span className="text-sm text-zinc-200">Required</span><Switch checked={field.required} onChange={v => set({ required: v })} /></div>
      <div className="rounded-lg border border-[#10B981]/25 bg-[#10B981]/5 p-3"><Label className="text-[#34d399]">Map to task property</Label>
        <Select value={isCustom ? 'custom' : (field.task_property || '')} onChange={e => { const v = e.target.value; set({ task_property: v === '' ? null : v === 'custom' ? 'custom:' + (field.label || 'Custom field') : v }); }}><option value="">None (plain answer)</option>{TASK_PROPERTIES.map(t => <option key={t.property} value={t.property}>{t.label}</option>)}</Select>
        {isCustom && <div className="mt-2"><Label>Custom field name</Label><Input value={field.task_property.slice(7)} onChange={e => set({ task_property: 'custom:' + e.target.value })} placeholder="e.g. Budget" /></div>}
        <p className="mt-2 text-xs text-[#34d399]/70">Submitted values flow into the generated task automatically.</p>
      </div>
    </div>
  </div>;
}

/* ============================ Settings ============================ */
const PRESETS = ['#7B68EE','#EC4899','#10B981','#F5A524','#3B82F6','#E5484D','#8B5CF6','#14B8A6'];
function SettingsView({ form, set }) {
  const tt = form.task_template;
  const Section = ({ icon, title, desc, children }) => <section className="rounded-xl border border-[#26262f] bg-[#14141a] p-5"><div className="mb-4 flex items-center gap-3"><span className="flex h-9 w-9 items-center justify-center rounded-lg bg-[#7B68EE]/15 text-[#a99bf5]"><Ic n={icon} s={18} /></span><div><h3 className="text-sm font-bold text-zinc-100">{title}</h3><p className="text-xs text-zinc-500">{desc}</p></div></div><div className="space-y-4">{children}</div></section>;
  const Row = ({ label, hint, children }) => <div className="flex items-center justify-between gap-4"><div><p className="text-sm text-zinc-200">{label}</p>{hint && <p className="text-xs text-zinc-500">{hint}</p>}</div>{children}</div>;
  return <div className="mx-auto max-w-2xl space-y-5">
    <Section icon="eye" title="Form styling" desc="How the public form looks.">
      <div><Label>Theme</Label><div className="inline-flex rounded-lg border border-[#26262f] bg-[#0f0f14] p-1">{[['light','sun','Light'],['dark','moon','Dark']].map(([v, ic, lb]) => <button key={v} onClick={() => set({ theme: v })} className={cx('inline-flex items-center gap-2 rounded-md px-4 py-1.5 text-sm font-medium transition', form.theme === v ? 'bg-[#7B68EE] text-white' : 'text-zinc-400 hover:text-zinc-100')}><Ic n={ic} s={15} />{lb}</button>)}</div></div>
      <div><Label>Primary color</Label><div className="flex flex-wrap items-center gap-3"><input type="color" value={form.primary_color} onChange={e => set({ primary_color: e.target.value })} className="h-9 w-12 cursor-pointer rounded-md border border-[#2c2c37] bg-transparent p-1" /><Input value={form.primary_color} onChange={e => set({ primary_color: e.target.value })} className="w-32 mono" /><div className="flex gap-1.5">{PRESETS.map(c => <button key={c} onClick={() => set({ primary_color: c })} className={cx('h-6 w-6 rounded-full border-2', form.primary_color === c ? 'border-white' : 'border-transparent')} style={{ background: c }} />)}</div></div></div>
    </Section>
    <Section icon="send" title="Submission" desc="What happens on submit.">
      <div><Label>Submit button label</Label><Input value={form.submit_label} onChange={e => set({ submit_label: e.target.value })} /></div>
      <div><Label>Success message</Label><Textarea value={form.success_message} onChange={e => set({ success_message: e.target.value })} /></div>
      <div><Label>Redirect URL (optional)</Label><Input value={form.redirect_url} onChange={e => set({ redirect_url: e.target.value })} placeholder="https://example.com/thank-you" /></div>
      <Row label="Enable reCAPTCHA" hint="Protect against spam."><Switch checked={form.recaptcha_enabled} onChange={v => set({ recaptcha_enabled: v })} /></Row>
      <Row label="Show TAKSAM branding" hint="“Powered by” footer."><Switch checked={form.branding_enabled} onChange={v => set({ branding_enabled: v })} /></Row>
    </Section>
    <Section icon="spark" title="Task automation" desc="How generated tasks are created.">
      <div><Label>Auto-assign tasks to</Label><Input value={form.auto_assign_name} onChange={e => set({ auto_assign_name: e.target.value })} placeholder="Team member name" /></div>
      <div className="grid grid-cols-2 gap-3"><div><Label>Default status</Label><Select value={form.default_status} onChange={e => set({ default_status: e.target.value })}>{STATUSES.map(s => <option key={s} value={s}>{STATUS_LABEL[s]}</option>)}</Select></div><div><Label>Default priority</Label><Select value={form.default_priority} onChange={e => set({ default_priority: e.target.value })}><option value="">None</option>{Object.keys(PRIORITIES).map(p => <option key={p} value={p}>{PRIORITIES[p].label}</option>)}</Select></div></div>
      <div><Label>Task template — default tags</Label><Input value={(tt.tags || []).join(', ')} onChange={e => set({ task_template: { ...tt, tags: e.target.value.split(',').map(s => s.trim()).filter(Boolean) } })} placeholder="intake, web (comma separated)" /></div>
    </Section>
  </div>;
}

/* ============================ Public form ============================ */
function PublicForm({ form, fields, onSubmit }) {
  const dark = form.theme === 'dark';
  const [answers, setAnswers] = useState({}); const [errors, setErrors] = useState({}); const [done, setDone] = useState(false);
  useEffect(() => { setAnswers({}); setErrors({}); setDone(false); }, [form.template_key]);
  const setA = (k, v) => setAnswers(a => ({ ...a, [k]: v }));
  const submit = e => { e.preventDefault(); const errs = {}; fields.forEach(fl => { if (fl.field_type === 'info_block') return; const k = keyOf(fl); const v = answers[k]; const empty = v == null || v === '' || v === false || (Array.isArray(v) && !v.length) || (v === 0 && fl.field_type === 'rating'); if (fl.required && empty) errs[k] = fl.label + ' is required'; }); setErrors(errs); if (Object.keys(errs).length) return; onSubmit(buildTask(form, fields, answers)); setDone(true); };
  const inp = dark ? 'border-white/15 bg-white/5 text-white placeholder:text-zinc-500' : 'border-black/15 bg-white text-zinc-900 placeholder:text-zinc-400';
  const base = 'w-full rounded-lg border px-3 py-2.5 text-sm focus:outline-none focus:ring-2 transition ' + inp;
  const lbl = cx('mb-1.5 block text-sm font-medium', dark ? 'text-zinc-200' : 'text-zinc-700');
  const Field = ({ fl }) => {
    if (fl.field_type === 'info_block') return <div className={cx('rounded-lg border px-4 py-3', dark ? 'border-white/10 bg-white/5' : 'border-black/10 bg-black/5')}><p className={cx('text-sm font-semibold', dark ? 'text-zinc-100' : 'text-zinc-800')}>{fl.label}</p>{fl.help_text && <p className={cx('mt-1 text-sm', dark ? 'text-zinc-400' : 'text-zinc-500')}>{fl.help_text}</p>}</div>;
    const k = keyOf(fl), v = answers[k], err = errors[k];
    const L = () => <label className={lbl}>{fl.label}{fl.required && <span className="text-red-500"> *</span>}</label>;
    const H = () => fl.help_text ? <p className={cx('mt-1 text-xs', dark ? 'text-zinc-500' : 'text-zinc-400')}>{fl.help_text}</p> : null;
    const E = () => err ? <p className="mt-1 text-xs font-medium text-red-500">{err}</p> : null;
    let ctrl;
    if (fl.field_type === 'long_text') ctrl = <textarea rows={4} value={v || ''} placeholder={fl.placeholder} onChange={e => setA(k, e.target.value)} className={base + ' resize-y'} style={{ '--tw-ring-color': form.primary_color + '55' }} />;
    else if (fl.field_type === 'dropdown') ctrl = <select value={v || ''} onChange={e => setA(k, e.target.value)} className={base + ' cursor-pointer'}><option value="">{fl.placeholder || 'Select…'}</option>{fl.options.map((o, i) => <option key={i} value={o.value}>{o.label}</option>)}</select>;
    else if (fl.field_type === 'multi_select') { const arr = v || []; ctrl = <div className="flex flex-wrap gap-2">{fl.options.map((o, i) => { const on = arr.includes(o.value); return <button type="button" key={i} onClick={() => setA(k, on ? arr.filter(x => x !== o.value) : [...arr, o.value])} className={cx('rounded-full border px-3 py-1.5 text-xs font-medium transition', on ? 'text-white' : dark ? 'border-white/15 text-zinc-300' : 'border-black/15 text-zinc-600')} style={on ? { background: form.primary_color, borderColor: form.primary_color } : undefined}>{o.label}</button>; })}</div>; }
    else if (fl.field_type === 'checkbox') return <div><label className="flex cursor-pointer items-start gap-2.5"><input type="checkbox" checked={!!v} onChange={e => setA(k, e.target.checked)} style={{ accentColor: form.primary_color }} className="mt-0.5 h-4 w-4" /><span className={cx('text-sm', dark ? 'text-zinc-200' : 'text-zinc-700')}>{fl.label}{fl.required && <span className="text-red-500"> *</span>}</span></label><E /></div>;
    else if (fl.field_type === 'rating') { const sc = fl.config.scale || 5; ctrl = <div className="flex gap-1.5">{Array.from({ length: sc }).map((_, i) => <button type="button" key={i} onClick={() => setA(k, i + 1)}><svg width="28" height="28" viewBox="0 0 24 24" fill={i < (v || 0) ? form.primary_color : 'transparent'} stroke={form.primary_color} strokeWidth="2" style={{ opacity: i < (v || 0) ? 1 : .4 }} dangerouslySetInnerHTML={{ __html: ICONS.star }} /></button>)}</div>; }
    else if (fl.field_type === 'file_upload') ctrl = <label className={cx('flex cursor-pointer items-center gap-3 rounded-lg border border-dashed px-4 py-3 text-sm', dark ? 'border-white/20 text-zinc-300' : 'border-black/20 text-zinc-600')}><Ic n="upload" s={16} /><span className="truncate">{v || 'Choose a file…'}</span><input type="file" className="hidden" accept={fl.config.accept || undefined} onChange={e => setA(k, e.target.files?.[0]?.name || '')} /></label>;
    else if (fl.field_type === 'signature') ctrl = <SignaturePad value={v} onChange={val => setA(k, val)} />;
    else ctrl = <input type={fl.field_type === 'email' ? 'email' : fl.field_type === 'number' ? 'number' : fl.field_type === 'date' ? 'date' : fl.field_type === 'phone' ? 'tel' : 'text'} value={v || ''} placeholder={fl.placeholder} onChange={e => setA(k, e.target.value)} className={base} style={{ colorScheme: dark ? 'dark' : 'light' }} />;
    return <div><L />{ctrl}<H /><E /></div>;
  };
  return <div className={cx('min-h-full', dark ? 'bg-[#0f0f14]' : 'bg-zinc-100')} style={{ '--p': form.primary_color }}>
    <div className="mx-auto w-full max-w-xl px-5 py-10">
      <div className={cx('overflow-hidden rounded-2xl border shadow-xl', dark ? 'border-white/10 bg-[#1b1b23]' : 'border-black/10 bg-white')}>
        <div className="h-1.5 w-full" style={{ background: form.primary_color }} />
        <div className="px-6 py-7 sm:px-8">
          <h1 className={cx('text-2xl font-extrabold tracking-tight', dark ? 'text-white' : 'text-zinc-900')}>{form.name}</h1>
          {form.description && <p className={cx('mt-2 text-sm', dark ? 'text-zinc-400' : 'text-zinc-500')}>{form.description}</p>}
          <div className="mt-6">
            {done ? <div className="flex flex-col items-center py-8 text-center"><span style={{ color: form.primary_color }}><Ic n="check" s={44} /></span><p className={cx('mt-3 text-base font-bold', dark ? 'text-white' : 'text-zinc-900')}>{form.success_message}</p><p className={cx('mt-1 text-xs', dark ? 'text-zinc-500' : 'text-zinc-400')}>A task was created — open the Board tab.</p><button onClick={() => setDone(false)} className="mt-4 text-xs font-semibold underline" style={{ color: form.primary_color }}>Submit another</button></div>
            : !fields.length ? <p className={cx('py-8 text-center text-sm', dark ? 'text-zinc-500' : 'text-zinc-400')}>Add fields in the Build tab to see them here.</p>
            : <form onSubmit={submit} className="space-y-5">{fields.map(fl => <Field key={fl.id} fl={fl} />)}{form.recaptcha_enabled && <div className={cx('flex items-center gap-2 rounded-lg border px-3 py-2 text-xs', dark ? 'border-white/10 text-zinc-500' : 'border-black/10 text-zinc-400')}><span className="h-4 w-4 rounded border" /> Protected by reCAPTCHA</div>}<button type="submit" className="w-full rounded-lg px-4 py-3 text-sm font-bold text-white shadow transition hover:opacity-90" style={{ background: form.primary_color }}>{form.submit_label}</button></form>}
          </div>
        </div>
      </div>
      {form.branding_enabled && <p className={cx('mt-4 text-center text-xs', dark ? 'text-zinc-600' : 'text-zinc-400')}>Powered by <span className="font-bold" style={{ color: form.primary_color }}>TAKSAM Forms</span></p>}
    </div>
  </div>;
}

/* ============================ Board ============================ */
function TaskMenuItem({ icon, label, onClick, danger }) {
  return <button onClick={onClick} className={cx('flex w-full items-center gap-2.5 rounded-md px-2.5 py-2 text-left text-sm hover:bg-[#1c1c22]', danger ? 'text-[#ff6b6b]' : 'text-zinc-200')}><Ic n={icon} s={15} />{label}</button>;
}

const GROUP_COLORS = ['#8b95a5', '#EC4899', '#14B8A6', '#F5A524', '#8B5CF6', '#E5484D', '#3B82F6'];

function Board({ tasks, cols, onCols, onMove, onUpdate, onDuplicate, onDelete, onAddTask }) {
  const drag = useRef(null);
  const [over, setOver] = useState(null);
  const [menu, setMenu] = useState(null);        // task menu { id, x, y }
  const [colMenu, setColMenu] = useState(null);  // group menu { key, x, y }
  const [collapsed, setCollapsed] = useState({});
  const [adding, setAdding] = useState(null);    // group key with open add-task input
  const [addText, setAddText] = useState('');
  const [newGroup, setNewGroup] = useState(false);
  const [newText, setNewText] = useState('');
  const setCols = onCols;  // groups are owned by App state so they persist across views

  const colByKey = k => cols.find(c => c.key === k);
  const firstKey = cols[0] ? cols[0].key : 'todo';
  const grouped = {}; cols.forEach(c => grouped[c.key] = []); tasks.forEach(t => { (grouped[t.status] || grouped[firstKey]).push(t); });

  const openMenu = (id, x, y) => setMenu({ id, x: Math.min(x, window.innerWidth - 234), y: Math.min(y, window.innerHeight - 360) });
  const task = menu && tasks.find(t => t.id === menu.id);
  const renameTask = (t) => { const v = window.prompt('Rename task', t.name); if (v != null && v.trim()) onUpdate(t.id, { name: v.trim() }); };

  const addTask = (key) => { const v = addText.trim(); if (v) onAddTask(v, key); setAddText(''); setAdding(null); };
  const addGroup = () => { const v = newText.trim(); if (v) { const key = slug(v) + '_' + Math.random().toString(36).slice(2, 5); setCols(cs => [...cs, { key, label: v.toUpperCase(), color: GROUP_COLORS[cs.length % GROUP_COLORS.length] }]); } setNewText(''); setNewGroup(false); };
  const renameGroup = (c) => { const v = window.prompt('Rename group', c.label); if (v != null && v.trim()) setCols(cs => cs.map(x => x.key === c.key ? { ...x, label: v.trim().toUpperCase() } : x)); };
  const deleteGroup = (c) => { if ((grouped[c.key] || []).length) { window.alert('Move or delete this group’s tasks first.'); return; } setCols(cs => cs.filter(x => x.key !== c.key)); };

  return <>
    <div className="flex h-full gap-4 overflow-x-auto p-1" style={{ minWidth: 'min-content' }}>
      {cols.map(c => {
        const s = c.key;
        if (collapsed[s]) return <div key={s} onClick={() => setCollapsed(m => ({ ...m, [s]: false }))} title="Expand group" className="flex w-10 shrink-0 cursor-pointer flex-col items-center gap-2 rounded-xl border border-[#26262f] bg-[#14141a] py-3">

          <span className="mt-1 text-[11px] font-bold tracking-wide" style={{ color: c.color, writingMode: 'vertical-rl' }}>{c.label}</span>
        </div>;
        return <div key={s}
          onDragOver={e => { e.preventDefault(); if (over !== s) setOver(s); }}
          onDragLeave={() => setOver(o => o === s ? null : o)}
          onDrop={() => { if (drag.current) { onMove(drag.current, s); drag.current = null; } setOver(null); }}
          className={cx('flex w-[300px] shrink-0 flex-col rounded-xl border bg-[#14141a] transition-colors', over === s ? 'border-[#7B68EE]' : 'border-[#26262f]')}>
          <div className="flex items-center justify-between border-b border-[#26262f] px-3 py-2.5">

            <div className="flex items-center gap-1"><Badge>{grouped[s].length}</Badge><button title="Group options" onClick={e => { const r = e.currentTarget.getBoundingClientRect(); setColMenu({ key: s, x: Math.min(r.right - 180, window.innerWidth - 190), y: r.bottom + 4 }); }} className="flex h-6 w-6 items-center justify-center rounded text-zinc-500 hover:bg-[#22222b] hover:text-zinc-100"><Ic n="dots" s={14} /></button></div>
          </div>
          <div className="flex-1 space-y-2.5 overflow-y-auto p-2.5">
            {grouped[s].length === 0 && adding !== s && <p className="rounded-lg border border-dashed border-[#26262f] px-1 py-5 text-center text-xs text-zinc-600">Drop tasks here</p>}
            {grouped[s].map(t => { const pm = PRIORITIES[t.priority]; const cust = Object.entries(t.custom || {}); return <div key={t.id} draggable onDragStart={() => { drag.current = t.id; }} onDragEnd={() => { drag.current = null; setOver(null); }} onContextMenu={e => { e.preventDefault(); openMenu(t.id, e.clientX, e.clientY); }} className="group relative cursor-grab rounded-lg border border-[#26262f] bg-[#0d0d12] p-3 transition hover:border-[#3a3a46] active:cursor-grabbing">
              <div className="absolute right-2 top-2 flex items-center gap-0.5 opacity-0 transition group-hover:opacity-100">

                <button title="More" onClick={e => { e.stopPropagation(); const r = e.currentTarget.getBoundingClientRect(); openMenu(t.id, r.right - 220, r.bottom + 4); }} className="flex h-6 w-6 items-center justify-center rounded text-zinc-400 hover:bg-[#22222b] hover:text-zinc-100"><Ic n="dots" s={14} /></button>
              </div>
              <p className="pr-12 text-sm font-semibold text-zinc-100">{t.name}</p>
              {t.description && <p className="mt-1 line-clamp-2 text-xs text-zinc-500">{t.description}</p>}
              <div className="mt-2 flex flex-wrap gap-1.5">{pm && <Badge color={pm.color}><Ic n="flag" s={11} />{pm.label}</Badge>}{t.assignee && <Badge><Ic n="user" s={11} />{t.assignee}</Badge>}{t.due && <Badge><Ic n="clock" s={11} />{t.due}</Badge>}{(t.tags || []).map((tg, i) => <Badge key={i} className="bg-[#7B68EE]/15 text-[#a99bf5]"><Ic n="tag" s={11} />{tg}</Badge>)}</div>
              {cust.length > 0 && <div className="mt-2 space-y-0.5 border-t border-[#1e1e26] pt-2">{cust.slice(0, 4).map(([k, v]) => <div key={k} className="flex gap-2 text-[11px]"><span className="text-zinc-500">{k}:</span><span className="truncate text-zinc-300">{String(v)}</span></div>)}</div>}
              {t.example && <span className="mt-2 inline-block text-[10px] uppercase tracking-wide text-zinc-600">example</span>}
            </div>; })}
            {adding === s
              ? <input autoFocus value={addText} onChange={e => setAddText(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addTask(s); if (e.key === 'Escape') { setAdding(null); setAddText(''); } }} onBlur={() => addTask(s)} placeholder="Task name, then Enter" className="w-full rounded-lg border border-[#7B68EE] bg-[#0d0d12] px-3 py-2 text-sm text-zinc-100 outline-none" />
              : <button onClick={() => { setAdding(s); setAddText(''); }} className="flex w-full items-center gap-1.5 rounded-lg px-2 py-1.5 text-left text-xs font-semibold text-zinc-500 transition hover:bg-[#1c1c22] hover:text-zinc-200"><Ic n="plus" s={13} /> Add Task</button>}
          </div>
        </div>;
      })}
      <div className="w-[220px] shrink-0 pt-1">
        {newGroup
          ? <input autoFocus value={newText} onChange={e => setNewText(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addGroup(); if (e.key === 'Escape') { setNewGroup(false); setNewText(''); } }} onBlur={addGroup} placeholder="Group name, then Enter" className="w-full rounded-lg border border-[#7B68EE] bg-[#14141a] px-3 py-2 text-sm text-zinc-100 outline-none" />
          : <button onClick={() => { setNewGroup(true); setNewText(''); }} className="flex w-full items-center gap-1.5 rounded-lg border border-dashed border-[#26262f] px-3 py-2 text-sm font-semibold text-zinc-500 transition hover:border-[#7B68EE]/60 hover:text-zinc-200"><Ic n="plus" s={15} /> Add group</button>}
      </div>
    </div>

    {colMenu && colByKey(colMenu.key) && <>
      <div className="fixed inset-0 z-[90]" onClick={() => setColMenu(null)} />
      <div className="fixed z-[95] w-[180px] rounded-xl border border-[#26262f] bg-[#0d0d12] p-1.5 shadow-2xl" style={{ left: colMenu.x, top: colMenu.y }}>
        <TaskMenuItem icon="pen" label="Rename" onClick={() => { const c = colByKey(colMenu.key); setColMenu(null); renameGroup(c); }} />

        <div className="my-1 h-px bg-[#1e1e26]" />
        <TaskMenuItem icon="trash" label="Delete group" danger onClick={() => { const c = colByKey(colMenu.key); setColMenu(null); deleteGroup(c); }} />
      </div>
    </>}

    {menu && task && <>
      <div className="fixed inset-0 z-[90]" onClick={() => setMenu(null)} onContextMenu={e => { e.preventDefault(); setMenu(null); }} />
      <div className="fixed z-[95] w-[220px] rounded-xl border border-[#26262f] bg-[#0d0d12] p-1.5 shadow-2xl" style={{ left: menu.x, top: menu.y }}>

        <TaskMenuItem icon="pen" label="Rename" onClick={() => { setMenu(null); renameTask(task); }} />
        <TaskMenuItem icon="copy" label="Duplicate" onClick={() => { onDuplicate(task.id); setMenu(null); }} />

        <p className="px-2.5 pb-1 text-[10px] font-bold uppercase tracking-wide text-zinc-600">Move to</p>
        <div className="flex flex-wrap gap-1 px-2 pb-1.5">{cols.map(c => <button key={c.key} onClick={() => { onMove(task.id, c.key); setMenu(null); }} className={cx('rounded px-2 py-1 text-[10px] font-semibold', task.status === c.key && 'ring-1 ring-white/30')} style={{ background: c.color + '22', color: c.color }}>{c.label}</button>)}</div>
        <p className="px-2.5 pb-1 text-[10px] font-bold uppercase tracking-wide text-zinc-600">Priority</p>
        <div className="flex items-center gap-1 px-2 pb-1.5">
          {Object.keys(PRIORITIES).map(pk => <button key={pk} title={PRIORITIES[pk].label} onClick={() => { onUpdate(task.id, { priority: pk }); setMenu(null); }} className="flex-1 rounded py-1.5 hover:bg-[#1c1c22]"><span className="mx-auto block h-2.5 w-2.5 rounded-full" style={{ background: PRIORITIES[pk].color }} /></button>)}
          <button title="None" onClick={() => { onUpdate(task.id, { priority: '' }); setMenu(null); }} className="flex-1 rounded py-1 text-[10px] text-zinc-500 hover:bg-[#1c1c22]">None</button>
        </div>
        <div className="my-1 h-px bg-[#1e1e26]" />
        <TaskMenuItem icon="trash" label="Delete" danger onClick={() => { onDelete(task.id); setMenu(null); }} />
      </div>
    </>}
  </>;
}

  const [wsView, setWsView] = useState('form');   // form | list | board
  const [tab, setTab] = useState('build');        // build | settings | preview
  const [form, setForm] = useState(saved && saved.form ? saved.form : defaultForm());
  const [fields, setFields] = useState(saved && saved.fields ? saved.fields : []);
  const [tasks, setTasks] = useState(saved && saved.tasks ? saved.tasks : defaultTasks());
  const [cols, setCols] = useState(saved && saved.cols ? saved.cols : defaultCols());
  const [selectedId, setSelectedId] = useState(null);
  const [pickerOpen, setPickerOpen] = useState(false);
  const [pendingTpl, setPendingTpl] = useState(null);

  // Persist so deletions / added groups don't reappear after reload.
  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify({ form, fields, tasks, cols })); } catch { /* noop */ } }, [form, fields, tasks, cols]);

  const moveTask = (id, status) => setTasks(ts => ts.map(t => t.id === id ? { ...t, status } : t));
  const updateTask = (id, patch) => setTasks(ts => ts.map(t => t.id === id ? { ...t, ...patch } : t));
  const deleteTask = (id) => setTasks(ts => ts.filter(t => t.id !== id));
  const duplicateTask = (id) => setTasks(ts => { const t = ts.find(x => x.id === id); if (!t) return ts; return [{ ...t, id: uid(), name: t.name + ' (copy)', example: false }, ...ts]; });
  const addTask = (name, status) => setTasks(ts => [{ id: uid(), name, description: '', status, priority: '', assignee: '', due: '', tags: [], custom: {}, created: Date.now() }, ...ts]);

  const setF = patch => setForm(p => ({ ...p, ...patch }));
  const selected = fields.find(f => f.id === selectedId) || null;

  const pickTemplate = key => { setPendingTpl(key); setView('location'); };
  const chooseLocation = (space, list) => { const t = TEMPLATES.find(x => x.key === pendingTpl) || TEMPLATES[0]; const b = t.build(); setForm({ ...defaultForm(), name: b.name, description: b.description || '', primary_color: b.primary_color, template_key: pendingTpl, status: 'draft', space_name: space.name, list_name: list.name }); const fl = withPos(b.fields); setFields(fl); setSelectedId(fl[0]?.id || null); setTasks([]); setCols(defaultCols()); setTab('build'); setWsView('form'); setView('workspace'); };
  const addField = fl => { setFields(fs => withPos([...fs, fl])); setSelectedId(fl.id); setPickerOpen(false); };
  const changeField = up => setFields(fs => fs.map(f => f.id === up.id ? up : f));
  const dupField = id => setFields(fs => { const i = fs.findIndex(f => f.id === id); if (i < 0) return fs; const c = { ...fs[i], id: uid(), label: fs[i].label + ' (copy)' }; const n = [...fs]; n.splice(i + 1, 0, c); setSelectedId(c.id); return withPos(n); });
  const delField = id => { setFields(fs => withPos(fs.filter(f => f.id !== id))); if (selectedId === id) setSelectedId(null); };

  const published = form.status === 'published';
  const SUBTABS = [['build', 'blocks', 'Build'], ['settings', 'settings', 'Settings'], ['preview', 'eye', 'Preview']];
  const VIEWS = [['list', 'list', 'List'], ['board', 'board', 'Board'], ['form', 'align', form.name || 'Form']];

  return <div className="flex h-full flex-col">
    <TopBar />
    <div className="flex min-h-0 flex-1">
      <Rail onForms={() => setView('hub')} />
      {view === 'hub' ? <><FormsSidebar /><Hub onPick={pickTemplate} /></>
        : view === 'location' ? <><FormsSidebar /><LocationPicker onSelect={chooseLocation} onClose={() => setView('hub')} /></> : (
        <div className="flex min-w-0 flex-1 flex-col bg-[#0d0d10]">
          <div className="flex flex-wrap items-center gap-3 border-b border-[#1e1e24] px-4 py-2.5">
            <IconBtn onClick={() => setView('hub')} title="Back to Forms"><Ic n="back" s={18} /></IconBtn>
            <div className="min-w-0">
              <input value={form.name} onChange={e => setF({ name: e.target.value })} className="w-48 truncate rounded bg-transparent px-1 text-sm font-bold text-zinc-100 outline-none hover:bg-[#1b1b23] focus:bg-[#1b1b23]" />
              <div className="flex items-center gap-1.5 px-1"><Ic n="pin" s={11} cls="text-zinc-600" /><span className="text-[11px] text-zinc-500">{form.space_name} <span className="text-zinc-600">/</span> {form.list_name} · List</span><Badge className={published ? 'bg-[#10B981]/15 text-[#34d399]' : 'bg-[#F5A524]/15 text-[#f5c17a]'}>{published ? 'Published' : 'Draft'}</Badge></div>
            </div>
            <div className="ml-auto flex items-center gap-2">
              <div className="inline-flex rounded-lg bg-[#141418] p-1 border border-[#26262f]">{VIEWS.map(([v, ic, lb]) => <button key={v} onClick={() => setWsView(v)} className={cx('inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-semibold transition', wsView === v ? 'bg-[#7B68EE] text-white' : 'text-zinc-400 hover:text-zinc-100')}><Ic n={ic} s={15} /><span className="max-w-[140px] truncate">{lb}</span></button>)}</div>
              <Btn size="sm" variant={published ? 'outline' : 'primary'} onClick={() => setF({ status: published ? 'draft' : 'published' })}><Ic n="send" s={15} /> {published ? 'Unpublish' : 'Publish'}</Btn>
            </div>
          </div>

          {wsView === 'form' && <div className="flex min-h-0 flex-1 flex-col">
            <div className="flex items-center gap-1 border-b border-[#1e1e24] px-4 py-1.5">{SUBTABS.map(([v, ic, lb]) => <button key={v} onClick={() => setTab(v)} className={cx('inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-medium transition', tab === v ? 'bg-[#1c1c22] text-zinc-100' : 'text-zinc-500 hover:text-zinc-200')}><Ic n={ic} s={14} />{lb}</button>)}</div>
            <div className="min-h-0 flex-1 overflow-hidden">
              {tab === 'build' && <div className="grid h-full grid-cols-1 lg:grid-cols-[1fr_336px]">
                <div className="overflow-y-auto p-6"><div className="mx-auto max-w-2xl"><div className="mb-4 flex items-center justify-between"><div><h2 className="text-sm font-bold text-zinc-200">Canvas</h2><p className="text-xs text-zinc-500">{fields.length} field{fields.length === 1 ? '' : 's'}</p></div><Btn size="sm" onClick={() => setPickerOpen(true)}><Ic n="plus" s={15} /> Add fields</Btn></div><Canvas fields={fields} selectedId={selectedId} onSelect={setSelectedId} onReorder={fs => setFields(withPos(fs))} onDup={dupField} onDel={delField} onAdd={() => setPickerOpen(true)} /><div className="mt-3"><AddQuestionMenu onAdd={addField} /></div></div></div>
                <aside className="hidden border-l border-[#1e1e24] bg-[#0d0d12] lg:block"><FieldEditor field={selected} onChange={changeField} onClose={() => setSelectedId(null)} /></aside>
              </div>}
              {tab === 'settings' && <div className="h-full overflow-y-auto p-6"><SettingsView form={form} set={setF} /></div>}
              {tab === 'preview' && <div className="h-full overflow-y-auto"><PublicForm form={form} fields={fields} onSubmit={t => setTasks(ts => [{ ...t }, ...ts])} /></div>}
            </div>
          </div>}

          {wsView === 'list' && <div className="min-h-0 flex-1"><ListView tasks={tasks} cols={cols} onMove={moveTask} onUpdate={updateTask} onDelete={deleteTask} onAddTask={addTask} /></div>}

          {wsView === 'board' && <div className="min-h-0 flex-1 overflow-hidden p-5"><Board tasks={tasks} cols={cols} onCols={setCols} onMove={moveTask} onUpdate={updateTask} onDuplicate={duplicateTask} onDelete={deleteTask} onAddTask={addTask} /></div>}
        </div>
      )}
    </div>
    <FieldPicker open={pickerOpen} onClose={() => setPickerOpen(false)} onAdd={addField} />
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
